name: Build ArmSoM CM5 Ubuntu 24.04 Server Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Perform clean build'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build CM5 RK3576 Ubuntu 24.04 Server
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            bison flex libssl-dev libncurses5-dev libncurses-dev bc libelf-dev \
            libmpc-dev libgmp-dev lz4 python3-lz4 fakeroot \
            rsync u-boot-tools device-tree-compiler python3 python3-pyelftools \
            python3-setuptools python3-pip python-is-python3 kmod cpio dosfstools \
            mtools fdisk parted debian-archive-keyring debootstrap qemu-user-static \
            binfmt-support pigz tree

      - name: Checkout armsom-sdk
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync required submodules
        run: |
          echo "Initializing target submodules for CM5 Ubuntu 24.04..."
          git submodule update --init --depth 1 device/rockchip
          git submodule update --init --depth 1 u-boot
          git submodule update --init --depth 1 kernel-6.1
          git submodule update --init --depth 1 rkbin
          git submodule update --init --depth 1 armsom-initrd
          git submodule update --init --depth 1 tools
          git submodule update --init --depth 1 prebuilts/gcc/linux-x86/aarch64/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu
          git submodule update --init --depth 1 ubuntu24.04

      - name: Pull Ubuntu 24.04 Git-LFS assets
        run: |
          cd ubuntu24.04
          git lfs pull
          ls -lh packages/arm64/libmali/

      - name: Configure board defconfig
        run: |
          ./build.sh armsom_cm5_rk3576_ubuntu24_server_defconfig

      - name: Build full firmware
        run: |
          ./build.sh

      - name: Package firmware artifacts
        run: |
          mkdir -p release-output
          DATE_TAG="$(date +%Y%m%d_%H%M%S)"

          echo "=== 1. Compressing update.img with dereferenced symlink ==="
          pigz -c -9 rockdev/update.img > release-output/armsom-cm5-rk3576-ubuntu24-server-${DATE_TAG}-update.img.gz

          echo "=== 2. Generating MD5 checksum ==="
          cd release-output
          md5sum armsom-cm5-rk3576-ubuntu24-server-${DATE_TAG}-update.img.gz > armsom-cm5-rk3576-ubuntu24-server-${DATE_TAG}-update.img.gz.md5
          cd "$GITHUB_WORKSPACE"

          echo "=== 3. Packaging all partition images with dereference (-h) ==="
          tar -chvf - -C rockdev . | pigz -p 4 > release-output/armsom-cm5-rk3576-ubuntu24-server-${DATE_TAG}-all-partitions.tar.gz

          echo "=== Release Output Summary ==="
          ls -lh release-output/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armsom-cm5-rk3576-ubuntu24-server-firmware
          path: release-output/*
          retention-days: 7

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*
          generate_release_notes: true
